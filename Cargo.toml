[package]
name = "lineup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.56", features = ["cargo", "derive"] }
clap_complete = "4.5.65"
clap_derive = "4.5.55"
cmd_lib = "2.0.0"
csv = "1.4.0"
env_logger = "0.11.8"
file-lock = "2.1.11"
inquire = "0.9.2"
lazy_static = "1.5.0"
log = { version = "0.4.29", features = ["kv_serde"] }
once_cell = "1.21.3"
rayon = "1.11.0"
rayon-cond = "0.4.0"
regex = "1.12.2"
rust-embed = "8.11.0"
scopeguard = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-value = "0.7.0"
serde_json = "1.0.149"
serde_with = "3.16.1"
serde_yaml = "0.9.34"
shellexpand = "3.1.1"
tera = "1.20.1"
thiserror = "2.0.18"
toml = "0.9.11"
